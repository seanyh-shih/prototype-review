<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype Review</title>
<style>
:root{--bg:#fff;--fg:#11181a;--muted:#6b7a7e;--line:#e3e8ea;--brand:#03ade2;--card:#f5f9fa}
@media (prefers-color-scheme:dark){:root{--bg:#10171a;--fg:#e8eff1;--muted:#93a3a8;--line:#26343a;--card:#172126}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Segoe UI","Noto Sans TC",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:48px 16px}
h1{font-size:28px;margin:0 0 4px}
p.sub{margin:0 0 32px;color:var(--muted)}
h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:32px 0 12px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.card{display:block;padding:16px 20px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;text-decoration:none;transition:border-color .15s}
a.card:hover,a.card:focus-visible{border-color:var(--brand);outline:none}
.name{font-weight:600}
.meta{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>

  <p class="sub">內部 review 用，點進專案即可瀏覽（桌機／平板／手機請直接縮放視窗檢查）。</p>

</body>
</html>
