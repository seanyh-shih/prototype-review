# YCO 品牌設定：組裝腳本依這份檔案決定要載入哪些樣式、字體與素材。
name: YCO
# 載入順序即為輸出 style.css 的合併順序
css:
  - tokens.css
  - base.css
  - components/button.css
# 放進頁面 <head> 的字體連結
fonts:
  - https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap
# 品牌共用素材：左邊是 brands/yco/assets/ 內的檔名，輸出頁面時會放在 assets/brand/
assets:
  - b_a_sliderContainer.png
  - b_a_sliderContainer_pd.png
  - b_a_sliderContainer_mb.png
