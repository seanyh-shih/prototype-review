  dt:
    file: assets/topbanner-media-dt.mp4
    poster: assets/topbanner-poster-dt.jpg
  pd:
    file: assets/topbanner-media-pd.mp4
    poster: assets/topbanner-poster-pd.jpg
  mb:
    file: assets/topbanner-media-mb.mp4
    poster: assets/topbanner-poster-mb.jpg
